<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f8;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 220px;
            box-shadow: 0 2px 8px #ddd;
        }
        select, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            cursor: pointer;
        }
        button {
            background: #198754;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .cart-link {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>My Shop</h1>
    <a class="cart-link" href="{{ url_for('view_cart') }}">
        🛒 View Cart
    </a>

    <div class="products">
        {% for product in products %}
        <div class="product">
            <h2>{{ product.name }}</h2>
            <p>Product ID: {{ product.id }}</p>

            <form action="{{ url_for('add_to_cart') }}" method="POST">
                <input type="hidden"
                       name="product_id"
                       value="{{ product.id }}">

                <label for="size-{{ product.id }}">Choose size:</label>
                <select name="size"
                        id="size-{{ product.id }}"
                        required>
                    {% for size, price in product.sizes.items() %}
                    <option value="{{ size }}">
                        {{ size }} - ₹{{ price }}
                    </option>
                    {% endfor %}
                </select>

                <button type="submit">Add to Cart</button>
            </form>
        </div>
        {% endfor %}
    </div>

</body>
</html>
